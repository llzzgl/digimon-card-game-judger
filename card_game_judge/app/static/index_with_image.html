<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎴 卡牌游戏智能裁判 - 增强版</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #e0e0e0;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        header {
            text-align: center;
            padding: 30px 0;
        }
        header h1 {
            font-size: 2.2em;
            color: #fff;
            margin-bottom: 8px;
        }
        header p {
            color: #888;
            font-size: 0.95em;
        }
        .card {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .card h2 {
            font-size: 1.1em;
            color: #4fc3f7;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        textarea {
            width: 100%;
            padding: 14px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            background: rgba(0,0,0,0.3);
            color: #fff;
            font-size: 15px;
            resize: vertical;
            min-height: 100px;
        }
        textarea:focus {
            outline: none;
            border-color: #4fc3f7;
        }
        textarea::placeholder { color: #666; }
        .btn {
            padding: 12px 28px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
        }
        .btn-primary {
            background: linear-gradient(135deg, #4fc3f7 0%, #29b6f6 100%);
            color: #000;
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(79,195,247,0.4); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .btn-secondary {
            background: rgba(255,255,255,0.1);
            color: #fff;
            margin-left: 10px;
        }
        .btn-secondary:hover { background: rgba(255,255,255,0.2); }
        .actions { margin-top: 16px; display: flex; align-items: center; gap: 12px; }
        .loading { display: inline-flex; align-items: center; gap: 8px; }
        .spinner {
            width: 16px; height: 16px;
            border: 2px solid rgba(255,255,255,0.2);
            border-top-color: #4fc3f7;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .error {
            background: rgba(244,67,54,0.2);
            border: 1px solid rgba(244,67,54,0.5);
            color: #ff8a80;
            padding: 14px;
            border-radius: 8px;
        }
        
        /* 图片上传区域 */
        .upload-area {
            border: 2px dashed rgba(79,195,247,0.5);
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 20px;
        }
        .upload-area:hover {
            border-color: #4fc3f7;
            background: rgba(79,195,247,0.1);
        }
        .upload-area.dragover {
            border-color: #4fc3f7;
            background: rgba(79,195,247,0.2);
        }
        .upload-icon {
            font-size: 3em;
            margin-bottom: 10px;
        }
        .upload-text {
            color: #aaa;
            font-size: 0.95em;
        }
        #image-preview {
            max-width: 100%;
            max-height: 400px;
            border-radius: 8px;
            margin-top: 15px;
            display: none;
        }
        #image-preview.show {
            display: block;
        }
        
        /* 识别结果 */
        .recognition-result {
            background: rgba(76,175,80,0.1);
            border: 1px solid rgba(76,175,80,0.3);
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
        }
        .recognition-result h3 {
            color: #81c784;
            font-size: 0.95em;
            margin-bottom: 10px;
        }
        .recognition-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
        }
        .recognition-item {
            background: rgba(0,0,0,0.2);
            padding: 10px;
            border-radius: 6px;
        }
        .recognition-label {
            font-size: 0.8em;
            color: #888;
            margin-bottom: 4px;
        }
        .recognition-value {
            color: #fff;
            font-weight: 500;
        }
        
        /* 回答区域 */
        .answer-section {
            background: rgba(0,0,0,0.2);
            border-radius: 8px;
            padding: 20px;
            line-height: 1.7;
            white-space: pre-wrap;
        }
        .answer-section p { margin-bottom: 12px; }
        
        /* 来源列表 */
        .sources { margin-top: 20px; }
        .sources h3 {
            font-size: 0.95em;
            color: #888;
            margin-bottom: 12px;
        }
        .source-item {
            background: rgba(0,0,0,0.2);
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 8px;
        }
        .source-title {
            font-weight: 500;
            color: #4fc3f7;
            margin-bottom: 4px;
        }
        .source-type {
            font-size: 0.8em;
            color: #888;
        }
        
        /* 标签页 */
        .tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 20px;
        }
        .tab {
            padding: 10px 20px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px 8px 0 0;
            cursor: pointer;
            transition: all 0.2s;
        }
        .tab:hover { background: rgba(255,255,255,0.1); }
        .tab.active {
            background: rgba(79,195,247,0.2);
            border-color: #4fc3f7;
            color: #4fc3f7;
        }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        /* 响应式 */
        @media (max-width: 768px) {
            .container { padding: 10px; }
            header h1 { font-size: 1.8em; }
            .actions { flex-direction: column; }
            .btn { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎴 卡牌游戏智能裁判</h1>
            <p>支持图片识别 + 文字询问的增强版裁判系统</p>
        </header>
        
        <!-- 标签页切换 -->
        <div class="tabs">
            <div class="tab active" onclick="switchTab('text')">📝 文字询问</div>
            <div class="tab" onclick="switchTab('image')">🖼️ 图片识别</div>
        </div>
        
        <!-- 文字询问模式 -->
        <div id="text-tab" class="tab-content active">
            <div class="card">
                <h2>💬 提问</h2>
                <textarea id="question-text" placeholder="请输入你的问题，例如：&#10;BT1-001 的登场时效果能否触发？&#10;进化时费用会退还吗？"></textarea>
                <div class="actions">
                    <button class="btn btn-primary" onclick="askQuestion()" id="ask-btn">
                        提交问题
                    </button>
                    <span id="text-status"></span>
                </div>
            </div>
            
            <div id="text-answer-card" class="card" style="display: none;">
                <h2>🤖 裁定回答</h2>
                <div id="text-answer" class="answer-section"></div>
                <div id="text-sources" class="sources"></div>
            </div>
        </div>
        
        <!-- 图片识别模式 -->
        <div id="image-tab" class="tab-content">
            <div class="card">
                <h2>📸 上传卡牌图片</h2>
                
                <!-- 上传区域 -->
                <div class="upload-area" id="upload-area" onclick="document.getElementById('file-input').click()">
                    <div class="upload-icon">📷</div>
                    <div class="upload-text">
                        点击或拖拽上传卡牌图片<br>
                        <small>支持 JPG、PNG 格式</small>
                    </div>
                    <input type="file" id="file-input" accept="image/*" style="display: none;" onchange="handleFileSelect(event)">
                </div>
                
                <!-- 图片预览 -->
                <img id="image-preview" alt="预览">
                
                <!-- 识别结果 -->
                <div id="recognition-result" class="recognition-result" style="display: none;">
                    <h3>✅ 识别结果</h3>
                    <div class="recognition-info" id="recognition-info"></div>
                </div>
                
                <!-- 附加问题 -->
                <div style="margin-top: 20px;">
                    <label style="display: block; margin-bottom: 8px; color: #aaa;">
                        附加问题 (可选):
                    </label>
                    <textarea id="image-question" placeholder="例如：这张卡的效果什么时候触发？" style="min-height: 60px;"></textarea>
                </div>
                
                <div class="actions">
                    <button class="btn btn-primary" onclick="processImage()" id="process-btn">
                        识别并询问
                    </button>
                    <button class="btn btn-secondary" onclick="resetImage()">
                        重置
                    </button>
                    <span id="image-status"></span>
                </div>
            </div>
            
            <div id="image-answer-card" class="card" style="display: none;">
                <h2>🤖 裁定回答</h2>
                <div id="image-answer" class="answer-section"></div>
                <div id="image-sources" class="sources"></div>
            </div>
        </div>
    </div>
    
    <script>
        // 全局变量
        let currentImageFile = null;
        
        // 切换标签页
        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            
            if (tab === 'text') {
                document.querySelector('.tab:nth-child(1)').classList.add('active');
                document.getElementById('text-tab').classList.add('active');
            } else {
                document.querySelector('.tab:nth-child(2)').classList.add('active');
                document.getElementById('image-tab').classList.add('active');
            }
        }
        
        // 文字询问
        async function askQuestion() {
            const question = document.getElementById('question-text').value.trim();
            if (!question) {
                alert('请输入问题');
                return;
            }
            
            const btn = document.getElementById('ask-btn');
            const status = document.getElementById('text-status');
            
            btn.disabled = true;
            status.innerHTML = '<span class="loading"><span class="spinner"></span>正在处理...</span>';
            
            try {
                const response = await fetch('/query', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        question: question,
                        top_k: 5
                    })
                });
                
                const data = await response.json();
                
                if (data.status === 'success') {
                    document.getElementById('text-answer').textContent = data.data.answer;
                    
                    // 显示来源
                    const sourcesDiv = document.getElementById('text-sources');
                    if (data.data.sources && data.data.sources.length > 0) {
                        sourcesDiv.innerHTML = '<h3>📚 参考来源</h3>' + 
                            data.data.sources.map(s => `
                                <div class="source-item">
                                    <div class="source-title">${s.title || '未知'}</div>
                                    <div class="source-type">${s.type || '文档'}</div>
                                </div>
                            `).join('');
                    } else {
                        sourcesDiv.innerHTML = '';
                    }
                    
                    document.getElementById('text-answer-card').style.display = 'block';
                } else {
                    throw new Error(data.detail || '请求失败');
                }
            } catch (error) {
                alert('错误：' + error.message);
            } finally {
                btn.disabled = false;
                status.innerHTML = '';
            }
        }
        
        // 处理文件选择
        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (file) {
                currentImageFile = file;
                showPreview(file);
            }
        }
        
        // 显示图片预览
        function showPreview(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = document.getElementById('image-preview');
                img.src = e.target.result;
                img.classList.add('show');
            };
            reader.readAsDataURL(file);
        }
        
        // 重置图片
        function resetImage() {
            currentImageFile = null;
            document.getElementById('file-input').value = '';
            document.getElementById('image-preview').classList.remove('show');
            document.getElementById('recognition-result').style.display = 'none';
            document.getElementById('image-answer-card').style.display = 'none';
            document.getElementById('image-question').value = '';
        }
        
        // 处理图片
        async function processImage() {
            if (!currentImageFile) {
                alert('请先上传卡牌图片');
                return;
            }
            
            const question = document.getElementById('image-question').value.trim();
            const btn = document.getElementById('process-btn');
            const status = document.getElementById('image-status');
            
            btn.disabled = true;
            status.innerHTML = '<span class="loading"><span class="spinner"></span>正在识别和处理...</span>';
            
            try {
                const formData = new FormData();
                formData.append('file', currentImageFile);
                if (question) {
                    formData.append('question', question);
                }
                
                const response = await fetch('/image/query', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (data.status === 'success') {
                    // 显示识别结果
                    const recognition = data.data.recognition;
                    if (recognition) {
                        const infoDiv = document.getElementById('recognition-info');
                        infoDiv.innerHTML = '';
                        
                        if (recognition.card_number) {
                            infoDiv.innerHTML += `
                                <div class="recognition-item">
                                    <div class="recognition-label">卡牌编号</div>
                                    <div class="recognition-value">${recognition.card_number}</div>
                                </div>
                            `;
                        }
                        if (recognition.card_name) {
                            infoDiv.innerHTML += `
                                <div class="recognition-item">
                                    <div class="recognition-label">卡牌名称</div>
                                    <div class="recognition-value">${recognition.card_name}</div>
                                </div>
                            `;
                        }
                        if (recognition.confidence) {
                            infoDiv.innerHTML += `
                                <div class="recognition-item">
                                    <div class="recognition-label">置信度</div>
                                    <div class="recognition-value">${(recognition.confidence * 100).toFixed(1)}%</div>
                                </div>
                            `;
                        }
                        if (recognition.analysis) {
                            infoDiv.innerHTML += `
                                <div class="recognition-item" style="grid-column: 1 / -1;">
                                    <div class="recognition-label">分析</div>
                                    <div class="recognition-value">${recognition.analysis}</div>
                                </div>
                            `;
                        }
                        
                        document.getElementById('recognition-result').style.display = 'block';
                    }
                    
                    // 显示回答
                    document.getElementById('image-answer').textContent = data.data.answer;
                    
                    // 显示来源
                    const sourcesDiv = document.getElementById('image-sources');
                    if (data.data.sources && data.data.sources.length > 0) {
                        sourcesDiv.innerHTML = '<h3>📚 参考来源</h3>' + 
                            data.data.sources.map(s => `
                                <div class="source-item">
                                    <div class="source-title">${s.title || '未知'}</div>
                                    <div class="source-type">${s.type || '文档'}</div>
                                </div>
                            `).join('');
                    } else {
                        sourcesDiv.innerHTML = '';
                    }
                    
                    document.getElementById('image-answer-card').style.display = 'block';
                } else {
                    throw new Error(data.detail || '请求失败');
                }
            } catch (error) {
                alert('错误：' + error.message);
            } finally {
                btn.disabled = false;
                status.innerHTML = '';
            }
        }
        
        // 拖拽上传支持
        const uploadArea = document.getElementById('upload-area');
        
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });
        
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });
        
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('image/')) {
                currentImageFile = file;
                showPreview(file);
            } else {
                alert('请上传图片文件');
            }
        });
    </script>
</body>
</html>
